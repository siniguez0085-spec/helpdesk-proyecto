<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Design System - Help Desk</h1>

    <section>
        <h2>Botones</h2>

        <button class="btn btn-primary">
            Botón Primario
        </button>

        <button class="btn btn-secondary">
            Botón Secundario
        </button>

        <button class="btn btn-danger">
            Botón Peligro
        </button>
    </section>

    <section>
        <h2>Formulario</h2>

        <input type="text" placeholder="Ingrese nombre">

        <select>
            <option>Seleccione una opción</option>
            <option>Hardware</option>
            <option>Software</option>
            <option>Redes</option>
        </select>
    </section>

    <section>
        <h2>Tarjeta de Ticket</h2>

        <div class="card">
            <h3>Error de Impresora</h3>

            <p>
                La impresora no responde al momento de imprimir.
            </p>
        </div>
    </section>

    <section>
        <h2>Prioridades</h2>

        <span class="badge alta">
            Alta
        </span>

        <span class="badge media">
            Media
        </span>

        <span class="badge baja">
            Baja
        </span>

    </section>

</body>
</html>
